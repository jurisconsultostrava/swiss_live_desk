services:
  postgres:
    image: postgres:16
    container_name: swiss_gold_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: swiss_gold
      POSTGRES_USER: swiss_gold
      POSTGRES_PASSWORD: swiss_gold_dev
    ports:
      - "5432:5432"
    volumes:
      - swiss_gold_pgdata:/var/lib/postgresql/data

volumes:
  swiss_gold_pgdata:
